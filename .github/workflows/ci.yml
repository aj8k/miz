name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The runner's rustup ships a stable that can lag a week behind;
      # edition 2024 and egui 0.37 need 1.95 or newer.
      - run: rustup update --no-self-update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
      - run: desktop-file-validate assets/com.antonjoy.miz.desktop
      # --no-net: the screenshot URLs point at a release tag that may not
      # exist yet.
      - run: appstreamcli validate --no-net assets/com.antonjoy.miz.metainfo.xml
