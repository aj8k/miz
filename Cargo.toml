[package]
name = "miz"
version = "0.1.0"
edition = "2024"
description = "A calm, native music visualizer for PipeWire"
license = "MIT"
authors = ["Anton Joy <anton@antonjoy.com>"]
repository = "https://github.com/aj8k/miz"
readme = "README.md"

[dependencies]
# Error type with context for startup / top-level failures.
anyhow = "1"
# Safe casting of #[repr(C)] uniform structs and sample arrays to bytes.
bytemuck = { version = "1", features = ["derive"] }
# Settings menu: immediate-mode UI (text, sliders, mouse) drawn with
# wgpu over the visuals. Only the Wayland/X11 input glue, no clipboard.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
# Logging facade (wgpu reports through it) + RUST_LOG-controlled backend.
env_logger = "0.11"
log = "0.4"
# WGSL parser/validator (already used inside wgpu): readable shader errors
# with line numbers for hot reload, before anything reaches the GPU.
naga = { version = "30", features = ["wgsl-in"] }
# File watching (inotify) for config and shader hot reload.
notify = "8"
# Tiny block_on for wgpu's async adapter/device requests.
pollster = "1"
# FFT for the spectrum analysis (pure Rust, SIMD-accelerated).
rustfft = "6.4"
# Config file: TOML deserialized into typed structs.
serde = { version = "1", features = ["derive"] }
toml = "1"
# "Save as default": rewrites values in config.toml, keeping its comments.
toml_edit = "0.25"
# GPU rendering. Only the backends that matter on Linux: Vulkan, with GL as fallback.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
# Window + input; talks to Wayland/X11 via dlopen, so no dev headers needed.
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1

# The DSP runs per audio hop; keep it fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2

# `cargo deb` (cargo install cargo-deb) -> target/debian/miz_<version>-1_<arch>.deb
[package.metadata.deb]
maintainer = "Anton Joy <anton@antonjoy.com>"
section = "sound"
copyright = "2026 Anton Joy"
license-file = ["LICENSE", "0"]
extended-description = """\
miz turns whatever the computer is playing into slow, flowing visuals: \
feedback tunnels, a stereo scope, a radial spectrum and a nebula. It \
captures only the monitor of the default output through pw-record, never \
a microphone, and limits how fast the picture's brightness may change."""
# winit, wgpu and pw-record are loaded at runtime (dlopen / child process),
# so $auto can't see them: Vulkan + EGL, Wayland, and PipeWire's pw-record.
depends = "$auto, pipewire-bin, libvulkan1, libegl1, libwayland-client0, libwayland-egl1, libxkbcommon0"
# X11 sessions (winit's X11 backend), GPU drivers, the session manager that
# links pw-record to the output.
recommends = "wireplumber, mesa-vulkan-drivers | vulkan-icd, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon-x11-0"
assets = [
    ["target/release/miz", "usr/bin/", "755"],
    ["assets/com.antonjoy.miz.desktop", "usr/share/applications/", "644"],
    ["assets/com.antonjoy.miz.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/com.antonjoy.miz.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/miz/", "644"],
]
